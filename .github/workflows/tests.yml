name: Run Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # 集成运行期依赖（manifest.json requirements），测试导入链会触发 lunar_python
          python -m pip install "lunar-python==1.4.8"
          python -m pip install pytest-homeassistant-custom-component
          python -m pip install pytest

      - name: Verify test plugins are importable
        run: python -c "import pytest_homeassistant; print('pytest_homeassistant import OK')"

      - name: Run pytest
        run: python -m pytest tests -v
